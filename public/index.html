<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chat WebSocket con Vue 3</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main id="app" class="container py-4 py-md-5 app-shell">
      <div class="row g-4">
        <section class="col-12 col-lg-4">
          <div class="card shadow-sm h-100">
            <div class="card-body">
              <h1 class="h4 mb-3">Chat WebSocket</h1>

              <div class="d-flex align-items-center gap-2 mb-3">
                <span class="status-dot" :class="statusClass"></span>
                <span class="small text-muted">{{ statusText }}</span>
              </div>

              <div class="d-flex justify-content-between align-items-start gap-2 mb-0">
                <div>
                  <button class="btn btn-outline-secondary btn-sm" type="button" @click="clearMessages">Limpiar</button>
                </div>
              </div>
            </div>
          </div>
        </section>

        <section class="col-12 col-lg-8">
          <div class="card shadow-sm h-100">
            <div class="card-body d-grid gap-3">
              <div class="row g-2 align-items-end">
                <div class="col-12 col-md">
                  <label class="form-label mb-1" for="nameInput">Tu nombre</label>
                  <input
                    id="nameInput"
                    class="form-control"
                    type="text"
                    maxlength="20"
                    placeholder="Ej. Ana"
                    v-model.trim="name"
                    @keyup.enter="updateName"
                  />
                </div>
                <div class="col-12 col-md-auto">
                  <button class="btn btn-primary w-100" type="button" @click="updateName">Usar nombre</button>
                </div>
              </div>

              <div class="messages" ref="messagesBox">
                <div
                  v-for="message in messages"
                  :key="message.id"
                  class="alert mb-2 py-2 px-3 message-item"
                  :class="messageClass(message.kind)"
                >
                  <span class="message-meta">{{ message.meta }}</span>
                  <p class="mb-0">{{ message.text }}</p>
                </div>
              </div>

              <form class="row g-2 align-items-center" @submit.prevent="sendMessage">
                <div class="col-12 col-md">
                  <input
                    id="messageInput"
                    class="form-control"
                    type="text"
                    maxlength="200"
                    placeholder="Escribe un mensaje"
                    autocomplete="off"
                    v-model.trim="message"
                  />
                </div>
                <div class="col-12 col-md-auto">
                  <button type="submit" class="btn btn-success w-100">Enviar</button>
                </div>
              </form>
            </div>
          </div>
        </section>
      </div>
    </main>

    <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
    <script src="app.js"></script>
  </body>
</html>
